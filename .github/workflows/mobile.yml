# Builds the phone app on every push that changes it: the shared package comes from grepx-platform (checked out next
# to this repo and linked in as platform/, as ./workspace.sh does), the screens from apps/mobile. Download each APK
# from the run's artifacts. Repository variables (Settings > Secrets and variables > Actions > Variables) give each
# product's site: API_BASE_BLOOD, API_BASE_ELECTRONICS.
name: mobile
on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {product: blood-donation, entry: lib/main.dart, site: API_BASE_BLOOD}
          - {product: electronics, entry: lib/main_electronics.dart, site: API_BASE_ELECTRONICS}
    steps:
      - uses: actions/checkout@v4
        with: {path: product}
      - uses: actions/checkout@v4
        with: {repository: grepx-support/grepx-platform, path: grepx-platform}
      - run: ln -s ../grepx-platform/platform product/platform
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - working-directory: product/apps/mobile
        run: bash setup.sh
      - working-directory: product/apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - working-directory: product/apps/mobile
        run: flutter build apk --release -t ${{ matrix.entry }} --dart-define=API_BASE=${{ vars[matrix.site] || 'http://10.0.2.2:8851' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-apk
          path: product/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
