# How blood donation plugs into the generic services (grepx.workspace.yaml `deployment:` points here).
# Laid over config/common.yaml for every service; generic services never name a product's tables, templates or rules -
# they read them from here. A new product starts from `scripts/run.sh new-product NAME`.
# The role ladder for this deployment (grepx_service.Roles): the member role every new account gets, the staff roles, the admin.
roles:
  member: donor
  staff: [volunteer, admin]
  admin: admin
# Home-country phone numbers (grepx_service.Phone): calling code, what a local number looks like, an example for messages.
phone:
  country: "65"
  local: "[3689]\\d{7}"
  example: "9123 4567"

links:            # site pages that messages link to (joined to SITE_URL by grepx_config.deployment.link)
  home: /
  events: /#events
  dashboard: /dashboard
  event: /drive/{id}
  certificate: /certificate/{code}
person:                    # the person record generic services read (name, email, phone); run.sh admin creates one
  table: people            # people-service; the blood fields ride along through plugins.profile (blood_profile)
  service: people-service
  requests: people_requests
  key: person_id
messages:         # message role a generic service sends -> this deployment's template key (template-service)
  event_announcement: drive_announcement
  event_invitation: drive_invitation
  event_reminder: drive_reminder
  booking_moved: slot_changed
  certificate: certificate
  referral_joined: referral_joined
  broadcast: broadcast
events:
  checklist_template: blood-drive-playbook   # checklist-service template applied to a new event
referral:
  join_points: 1           # a friend signs up
  convert_points: 2        # that friend converts (here: donates for the first time)
  conversion:              # the table whose rows mark a converted person (row key = person id)
    table: donor_stats
    field: count           # converted when this field > 0
plugins:          # product rules loaded by generic services (grepx_service.plugins)
  path: product-services/blood-donation/plugins
  questionnaire: blood_eligibility     # questionnaire-service: questions, rules, criteria
  audience: blood_audience             # campaign-service: who is in an audience / matches invite filters
  event_report: blood_event_stats      # event-report-service: product figures added to the event report
  profile: blood_profile               # people-service: blood group, sex, weight, date of birth on the person record

monitor:          # ops-monitor-service: the live operations screen at <site>/ops/ (generic; these lines make it this product's)
  title: LifeFlow Live
  subtitle: Blood donation drives · Singapore
  audience: admin                    # admin | staff - who may open it (session token + role from access-service)
  history_hours: 6                   # how much recent activity the wire shows after a restart
  map:
    center: [103.8198, 1.3521]       # lng, lat
    zoom: 10.6
    geocoder: onemap                 # onemap (Singapore) | nominatim (OpenStreetMap) | none
    country: sg
  places:                            # what is drawn on the map: one dot per open drive
    table: events
    id: event_id
    label: title
    address: venue
    date: event_date
    capacity: capacity
    where: "state = 'open' AND event_date >= '{today}'"
    counts:                          # numbers per drive, counted from another table by its drive id
      - {name: registered, table: bookings, by: event_id, where: "state IN ('confirmed', 'attended')"}
      - {name: donated, table: bookings, by: event_id, where: "state = 'attended'"}
    known: {}                        # "venue text": [lng, lat] for venues the geocoder cannot find
  words: {places: Upcoming drives, registered: registered, donated: donated}
  kpis:                              # headline numbers (count of rows, or sum: field)
    - {label: Donated today, table: donations, where: "donated_on = '{today}'"}
    - {label: Upcoming drives, table: events, where: "state = 'open' AND event_date >= '{today}'"}
    - {label: Registered (upcoming), table: bookings, where: "state = 'confirmed'"}
    - {label: Donations all time, table: donations}
