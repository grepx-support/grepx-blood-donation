# LifeFlow on the phone (iOS + Android). The look, shell, sign-in, notifications and charts come from the shared
# package grepx_app (grepx-platform, linked in as platform/ by ./workspace.sh); this app adds only the blood screens.
name: grepx_blood
description: LifeFlow - blood donation drives, your donor card, LifeBot, check-in.
publish_to: none
version: 2.0.0+2
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  grepx_app:
    path: ../../platform/mobile/grepx_app
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
